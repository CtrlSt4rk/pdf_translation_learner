name: Build Desktop Apps
on: [workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name "TranslationTrainer" --collect-all customtkinter main.py
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: TranslationTrainer-Windows
          path: dist/TranslationTrainer.exe
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: TranslationTrainer-macOS
          path: dist/TranslationTrainer.app
